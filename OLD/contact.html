<!doctype html>
<html lang="en">
  <head>
    <title>Contact — Ryan Waller</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=4"
    />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header id="banner">
      <div id="logo-container">
        <img
          alt="logo showing a laptop computer"
          id="logo"
          src="images/logo.png"
        />
      </div>
      <a href="#mobile-nav" class="menu-icon">
        <img
          src="images/menu.svg"
          alt="Open navigation menu"
          width="32"
          height="26"
        />
      </a>
      <div id="banner-content">
        <div id="banner-title">
          <h1>Ryan Waller</h1>
          <p class="banner-subtitle">Frontend Developer &amp; Universal Design</p>
        </div>
        <nav id="main-nav" aria-label="Primary navigation">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="writing.html">Writing</a></li>
            <li><a href="tools.html">Tools</a></li>
            <li><a href="contact.html" aria-current="page">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <h2>Get in Touch</h2>
      <p>If you have questions, please submit the form below.</p>
      <form id="contact-form">
        <div id="contact-fields">
          <div class="contact-field">
            <div class="field-content">
              <label for="name-field">Name</label>
              <input
                id="name-field"
                type="text"
                name="name"
                aria-required="true"
                data-errmsg="You must enter your name."
                required
              />
            </div>
            <div id="name-field-err" class="errmsg"></div>
          </div>
          <div class="contact-field">
            <div class="field-content">
              <label for="email-field">Email</label>
              <input
                id="email-field"
                type="email"
                name="email"
                aria-required="true"
                data-errmsg="You must enter your email address."
                required
              />
            </div>
            <div id="email-field-err" class="errmsg"></div>
          </div>
          <div class="contact-field">
            <div class="field-content">
              <label for="subject-field">Subject</label>
              <input
                id="subject-field"
                type="text"
                name="subject"
                aria-required="true"
                data-errmsg="You must enter a subject."
                required
              />
            </div>
            <div id="subject-field-err" class="errmsg"></div>
          </div>
          <div class="contact-field">
            <div class="field-content">
              <label for="msg-field">Message</label>
              <textarea
                id="msg-field"
                name="message"
                aria-required="true"
                data-errmsg="You must enter a message."
                required
              ></textarea>
            </div>
            <div id="msg-field-err" class="errmsg"></div>
          </div>
        </div>
        <div id="contact-submit">
          <button type="submit">Submit</button>
        </div>
      </form>
    </main>
    <footer>
      <p>Copyright &copy; 2026, Ryan Waller</p>
      <button class="toggle-css">Disable CSS</button>
    </footer>
    <nav id="mobile-nav" aria-label="Mobile navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="writing.html">Writing</a></li>
        <li><a href="tools.html">Tools</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
    <script src="js/main.js"></script>
    <script src="js/validate.js"></script>
  </body>
</html>
