<!doctype html>
<html lang="en">
  <head>
    <title>Ryan Waller: Information Accessibility and Universal Design</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=4"
    />
    <!-- Do not modify the next three lines. -->
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/jquery.min.js"></script>
  </head>
  <body>
    <header id="banner">
      <img
        alt="logo showing a laptop computer"
        class="logo"
        height="139"
        id="logo"
        src="images/logo.png"
        width="150"
      />
      <div id="banner-content">
        <div id="title">
          <h1>Ryan Waller</h1>
          <h2>Information Accessibility and Universal Design</h2>
        </div>
        <div>
          <nav id="main-nav">
            <ul>
              <li><a href="index.html">Home</a></li>
              <li><a href="about.html">About</a></li>
              <li><a href="contact.html">Contact</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </header>
    <main>
      <p>If you have questions, please submit the form below.</p>
      <form id="contact-form">
        <div id="contact-fields">
          <p class="contact-field">
            <label for="name-field">Name</label>
            <input id="name-field" type="text" name="name" required />
          </p>
          <p class="contact-field">
            <label for="email-field">Email</label>
            <input id="email-field" type="email" name="email" required />
          </p>
          <p class="contact-field">
            <label for="subject-field">Subject</label>
            <input id="subject-field" type="text" name="subject" required />
          </p>
          <p class="contact-field">
            <label for="msg-field">Message</label>
            <textarea id="msg-field" name="message" required></textarea>
          </p>
        </div>
        <div id="contact-submit">
          <button type="submit">Submit</button>
        </div>
      </form>
    </main>
    <footer>
      <p>Copyright &copy; 2026, Ryan Waller</p>
      <button class="toggle-css">Disable CSS</button>
    </footer>
    <script src="js/main.js"></script>
  </body>
</html>
